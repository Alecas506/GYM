<style>
:root {
  --bg: #15140f;
  --surface: #1f1d17;
  --surface-2: #2a2720;
  --line: #37342b;
  --text: #f1ede3;
  --muted: #948e7e;
  --accent: #c1461b;
  --accent-dim: #6f2c12;
  --accent-text: #ffd9c2;
  --danger: #b33a3a;
  --ok: #6a9955;
  --radius: 14px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-theme="light"]) { color-scheme: dark; }
:root[data-theme="light"] {
  --bg: #f4f1ea;
  --surface: #ffffff;
  --surface-2: #ece7db;
  --line: #ddd6c4;
  --text: #1c1a15;
  --muted: #726c5c;
  --accent: #b33f16;
  --accent-dim: #f0d3c3;
  --accent-text: #7c2a0d;
  --danger: #a23434;
  --ok: #4c7a37;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
.wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 60px; }
header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex-shrink: 0; }
h1 { font-family: 'Archivo Expanded', 'Inter', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 0.2px; margin: 0; line-height: 1.1; }
.today-date { font-size: 13px; color: var(--muted); text-transform: capitalize; margin-top: 2px; }
.theme-toggle { background: none; border: 0.5px solid var(--line); color: var(--muted); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-family: inherit; }

section { margin-bottom: 26px; }
.section-title { font-size: 13px; color: var(--muted); margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.section-head-row .section-title { margin-bottom: 0; }

.mode-switch { display: flex; background: var(--surface); border: 0.5px solid var(--line); border-radius: 20px; padding: 3px; font-size: 12px; }
.mode-switch button { background: none; border: none; color: var(--muted); padding: 6px 11px; border-radius: 17px; font-family: inherit; font-size: 12px; }
.mode-switch button.active { background: var(--accent); color: #fff; }

.day-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.day-tab {
  background: var(--surface);
  border: 0.5px solid var(--line);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 10px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  line-height: 1.3;
}
.day-tab .n { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
.day-tab:last-child:nth-child(odd) { grid-column: 1 / -1; }
.day-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.day-tab.active .n { color: var(--accent-text); }

.picker { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.picker-group { margin-bottom: 10px; }
.picker-group:last-child { margin-bottom: 0; }
.picker-group-name { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.picker-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-chip {
  background: var(--surface-2);
  border: 0.5px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-family: inherit;
  text-align: left;
  line-height: 1.35;
}
.pick-chip .scheme { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.pick-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.pick-chip.selected .scheme { color: var(--accent-text); }

.session-list { display: flex; flex-direction: column; gap: 8px; }
.session-row2 {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2); border: 0.5px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.session-row2.done { border-color: var(--ok); }
.session-row2 .chk {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent;
}
.session-row2.done .chk { border-color: var(--ok); background: var(--ok); color: #fff; }
.session-row2 .info { flex: 1; min-width: 0; }
.session-row2 .info .nm { font-size: 13.5px; font-weight: 500; }
.session-row2 .info .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.session-row2 .prog { font-size: 12px; color: var(--muted); font-family: 'Archivo Expanded', sans-serif; font-weight: 600; flex-shrink: 0; }
.session-row2.done .prog { color: var(--ok); }

.edit-day-label { margin-bottom: 12px; }
.edit-day-label label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.edit-group { background: var(--surface-2); border: 0.5px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.edit-group-head { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
.edit-group-name { flex: 1; font-size: 13px; font-weight: 600; padding: 8px 10px; }
.edit-del-btn { flex-shrink: 0; background: none; border: 0.5px solid var(--line); color: var(--danger); border-radius: 8px; padding: 0 10px; height: 34px; font-size: 15px; font-family: inherit; }
.edit-ex-row { background: var(--surface); border: 0.5px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 6px; }
.edit-ex-row .r1 { display: flex; gap: 6px; margin-bottom: 6px; }
.edit-ex-row .r1 input { flex: 1; font-size: 13px; padding: 7px 9px; }
.edit-ex-row .r2 { display: grid; grid-template-columns: 62px 1fr; gap: 6px; margin-bottom: 6px; }
.edit-ex-row .r2 input { font-size: 12.5px; padding: 7px 8px; }
.edit-ex-row .r3 input { font-size: 12.5px; padding: 7px 9px; width: 100%; }
.edit-ex-row .fl { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }
.edit-add-btn { width: 100%; background: none; border: 0.5px dashed var(--line); color: var(--muted); border-radius: 8px; padding: 9px; font-size: 12.5px; font-family: inherit; margin-bottom: 4px; }
.edit-restore-row { margin-top: 14px; text-align: center; }
.edit-restore-row .edit-restore-btn { display: block; margin: 8px auto 0; }
.edit-restore-btn { background: none; border: none; color: var(--muted); font-size: 12px; font-family: inherit; text-decoration: underline; }

.last-time-box {
  background: var(--surface-2); border: 0.5px solid var(--line); border-radius: 10px;
  padding: 9px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--muted);
}
.last-time-box b { color: var(--text); font-weight: 600; }
.last-time-box .sets { font-family: 'Archivo Expanded', sans-serif; font-weight: 600; color: var(--text); }
.target-hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }

form.logger { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
input {
  width: 100%; background: var(--surface-2); border: 0.5px solid var(--line);
  color: var(--text); border-radius: 10px; padding: 11px 12px; font-size: 16px; font-family: inherit;
}
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.weight-reps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.big-num-input { font-family: 'Archivo Expanded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 12px 8px; }
.add-btn {
  width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
  padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.add-btn:active { transform: scale(0.98); }
.error-msg { font-size: 12px; color: var(--danger); margin: -4px 0 10px; display: none; }
.error-msg.show { display: block; }

.timer-card {
  background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; align-items: center; gap: 14px;
}
.timer-display { font-family: 'Archivo Expanded', sans-serif; font-size: 30px; font-weight: 700; min-width: 84px; }
.timer-display.warn { color: var(--accent); }
.timer-controls { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; }
.timer-btn { background: var(--surface-2); border: 0.5px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 11px; font-size: 12.5px; font-family: inherit; }
.timer-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.timer-dur { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.timer-dur input { width: 60px; padding: 6px 8px; font-size: 13px; }
.timer-dur label { font-size: 11.5px; color: var(--muted); }

.exercise-card { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.exercise-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.exercise-name { font-size: 15px; font-weight: 600; }
.exercise-best { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sets-row { display: flex; flex-wrap: wrap; gap: 8px; }
.set-chip {
  background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-size: 13px;
  display: flex; align-items: center; gap: 6px; font-family: 'Archivo Expanded', sans-serif; font-weight: 600;
}
.set-chip .x { color: var(--muted); font-weight: 400; font-family: 'Inter', sans-serif; }
.set-chip button { background: none; border: none; color: var(--muted); padding: 0; margin-left: 2px; line-height: 1; font-size: 15px; cursor: pointer; }

.empty-state { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 13px; border: 0.5px dashed var(--line); border-radius: var(--radius); }

.hist-filter { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
.hist-filter-btn { flex-shrink: 0; background: var(--surface); border: 0.5px solid var(--line); color: var(--muted); border-radius: 20px; padding: 7px 13px; font-size: 12.5px; font-family: inherit; }
.hist-filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.history-item { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.history-item-head {
  width: 100%; background: none; border: none; color: var(--text); font-family: inherit;
  padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; cursor: pointer; gap: 8px;
}
.history-item-head .meta { color: var(--muted); font-size: 12px; font-weight: 400; }
.chev { transition: transform 0.15s ease; color: var(--muted); flex-shrink: 0; }
.history-item.open .chev { transform: rotate(180deg); }
.history-body { display: none; padding: 0 16px 16px; }
.history-item.open .history-body { display: block; }
.chart-wrap { margin: 4px 0 16px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 70px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 22px; background: var(--accent-dim); border-radius: 3px 3px 0 0; }
.bar-label { font-size: 9px; color: var(--muted); white-space: nowrap; }
.session-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 0.5px solid var(--line); font-size: 13px; gap: 10px; }
.session-row .d { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.session-row .s { text-align: right; font-family: 'Archivo Expanded', sans-serif; font-weight: 600; }
.del-ex { width: 100%; margin-top: 10px; background: none; border: 0.5px solid var(--line); color: var(--danger); border-radius: 8px; padding: 9px; font-size: 12px; font-family: inherit; }

.streak-card { background: var(--surface); border: 0.5px solid var(--line); border-radius: var(--radius); padding: 16px; }
.streak-top { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }
.streak-num { font-family: 'Archivo Expanded', sans-serif; font-size: 30px; font-weight: 700; }
.streak-label { font-size: 11.5px; color: var(--muted); }
.streak-stat { display: flex; flex-direction: column; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-cell { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); border: 0.5px solid var(--line); }
.cal-cell.trained { background: var(--accent); border-color: var(--accent); }
.cal-legend { display: flex; justify-content: flex-end; gap: 6px; align-items: center; margin-top: 8px; font-size: 10.5px; color: var(--muted); }
.cal-legend .sw { width: 10px; height: 10px; border-radius: 3px; }

.backup-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.backup-btn { background: none; border: 0.5px solid var(--line); color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 12px; font-family: inherit; }

footer { text-align: center; margin-top: 30px; }
.reset-btn { background: none; border: none; color: var(--muted); font-size: 12px; font-family: inherit; text-decoration: underline; }

.backup-box { border: 0.5px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); text-align: left; }
.backup-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.backup-status { font-size: 12px; color: var(--muted); line-height: 1.6; }
.backup-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.backup-banner { display: none; margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-dim); color: var(--accent-text); font-size: 13px; }
.backup-banner.show { display: block; }
.backup-banner .bb-row { display: flex; gap: 8px; margin-top: 8px; }
.backup-banner button { flex: 1; border-radius: 8px; padding: 8px; font-family: inherit; font-size: 12.5px; border: 0.5px solid var(--accent-text); background: none; color: var(--accent-text); }
.backup-banner button.go { background: var(--accent-text); color: var(--accent-dim); }
.app-toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%); background: var(--surface-2); color: var(--text); border: 0.5px solid var(--line); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 2000; max-width: 90%; text-align: center; }
.prog-select { width: 100%; background: var(--surface-2); color: var(--text); border: 0.5px solid var(--line); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px; margin-bottom: 10px; }
.pr-row { display: flex; gap: 8px; }
.pr-card { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.pr-card span { font-size: 10.5px; color: var(--muted); }
.pr-card b { font-size: 15px; }
.pr-card i { font-size: 10.5px; color: var(--muted); font-style: normal; }
.prog-empty, .prog-note { font-size: 12px; color: var(--muted); text-align: center; padding: 6px 0; }
.vol-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
.vol-name { width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vol-bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
.vol-bar > div { height: 100%; border-radius: 4px; }
.vol-bar > u { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .6; }
.vol-n { width: 64px; text-align: right; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="12" width="4" height="6" rx="1" fill="var(--accent)"/>
        <rect x="24" y="12" width="4" height="6" rx="1" fill="var(--accent)"/>
        <rect x="7" y="9" width="3" height="12" rx="1" fill="var(--text)"/>
        <rect x="20" y="9" width="3" height="12" rx="1" fill="var(--text)"/>
        <rect x="10" y="13.5" width="10" height="3" fill="var(--text)"/>

  <div class="backup-banner" id="backupBanner"></div>

  <section>
    <div class="section-head-row">
      <div class="section-title">Dia de rutina</div>
      <div class="mode-switch" id="modeSwitch">

        <button type="button" data-mode="session">Sesión</button>

  <section>

        </div>
        <div class="timer-dur">
          <label for="timerDurInput">Duracion por defecto (s)</label>
          <input type="number" id="timerDurInput" min="15" step="15">
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-title">Hoy</div>
    <div id="todayList"></div>
  </section>

  <section>
    <div class="section-title">Constancia</div>
    <div class="streak-card" id="streakCard"></div>
  </section>

  <section>
    <div class="section-title">Progreso</div>
    <div class="streak-card">
      <select id="progEx" class="prog-select"></select>
      <div id="progPRs"></div>
      <div id="progChart"></div>
    </div>
  </section>

  <section>
    <div class="section-title">Volumen semanal</div>
    <div class="streak-card" id="volCard"></div>
  </section>

  <section>
    <div class="section-title">Historial</div>
    <div class="hist-filter" id="histFilter"></div>
    <div id="historyList"></div>
  </section>

  <footer>
    <div class="backup-box">
      <div class="backup-title">Copias de seguridad</div>
      <div class="backup-status" id="backupStatus"></div>
      <div class="backup-row">
        <button class="backup-btn primary" id="shareBackupBtn" type="button">Guardar copia (compartir)</button>
        <button class="backup-btn" id="exportBtn" type="button">Descargar copia</button>
      </div>
      <div class="backup-row">
        <button class="backup-btn" id="importBtn" type="button">Restaurar desde archivo</button>
        <button class="backup-btn" id="snapBtn" type="button">Puntos de restauración</button>
        <button class="backup-btn" id="csvBtn" type="button">Exportar CSV</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
    <div style="margin-top:14px">
      <button class="reset-btn" id="resetBtn" type="button">Borrar todos los datos</button>
    </div>
  </footer>
</div>

<script>
const LS_WAS_EMPTY = (function(){ try { return localStorage.getItem('workout_log_v2') === null && localStorage.getItem('workout_log_routine_v1') === null; } catch (e) { return false; } })();
const STORAGE_KEY = 'workout_log_v2';
const THEME_KEY = 'workout_log_theme';
const ACTIVE_DAY_KEY = 'workout_log_active_day';
const REST_DUR_KEY = 'workout_log_rest_dur';
const VIEW_MODE_KEY = 'workout_log_view_mode';

const DEFAULT_ROUTINE = {
  d1: {
    label: 'Espalda',

        { name: 'Remo con barra', sets: 3, scheme: '8-6-4', note: 'aguantando 2\" en contracción' },

      ]}
    ]
  },
  d2: {

    groups: [
      { group: 'Pectoral', exs: [

        { name: 'Press banca libre', sets: 3, scheme: '6-4-2', note: 'apretando el pectoral, 2\" arriba' },
        { name: 'Aperturas planas en cruce de poleas', sets: 3, scheme: '8-6-4', note: 'muy pesado' },
        { name: 'Contractora', sets: 3, scheme: '8-6-4', note: 'pausa 2\" apretando' }

    ]
  },

    label: 'Pierna entera y gemelo',
    groups: [
      { group: 'Cuádriceps', exs: [

      ]},

        { name: 'Abductor en máquina', sets: 4, scheme: '8-8-8-8', note: 'superserie con adductor' }
      ]},
      { group: 'Gemelo', exs: [
        { name: 'Elevación de gemelos en multipower', sets: 6, scheme: '6-6-6-6-6-6', note: 'aguantando 2\" arriba' }
      ]}

  },
  d4: {
    label: 'Hombro y abdomen',
    groups: [
      { group: 'Hombro anterior', exs: [
        { name: 'Press Arnold con mancuernas', sets: 3, scheme: '12-10-8', note: 'aguantando 2\"' },
        { name: 'Press militar en máquina inclinada', sets: 3, scheme: '8-6-4', note: 'muy pesado' }
      ]},
      { group: 'Hombro lateral', exs: [
        { name: 'Elevaciones laterales', sets: 3, scheme: '12-10-8', note: 'aguantando 2\" arriba' },

      ]},

        { name: 'Encogimientos abdominales en máquina', sets: 4, scheme: '10-10-10-10', note: '' }
      ]}

  },
  d5: {
    label: 'Brazos',
    groups: [
      { group: 'Tríceps', exs: [
        { name: 'Press katana en polea baja', sets: 3, scheme: '8-6-4', note: 'muy pesado' },
        { name: 'Press francés en banco inclinado', sets: 3, scheme: '10-10-10', note: 'aguantando 2\" en extensión' },
        { name: 'Extensión con barra en V en polea alta', sets: 4, scheme: '12-10-8-6', note: 'aguantando 2\", apretando' },
        { name: 'Extensión agarre supino unilateral en polea alta', sets: 4, scheme: '10-10-10-10', note: 'muy lentas' }
      ]},
      { group: 'Bíceps', exs: [
        { name: 'Curl banco predicador en máquina', sets: 3, scheme: '4-2-1', note: 'muy pesado' },
        { name: 'Curl barra Z', sets: 4, scheme: '8-8-6-6', note: 'aguantando 2\", apretando' },
        { name: 'Curl martillo con mancuernas de pie', sets: 4, scheme: '12-10-8-6', note: 'aguantando 2\" arriba' },

      ]}
    ]
  }
};
let DAY_ORDER = Object.keys(DEFAULT_ROUTINE);
function dayNum(key) { const i = DAY_ORDER.indexOf(key); return i >= 0 ? i + 1 : '?'; }
function sortedDayKeys(r) {
  return Object.keys(r).filter(k => /^d\d+$/.test(k) && r[k] && Array.isArray(r[k].groups))
    .sort((a, b) => parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10));
}
const ROUTINE_KEY = 'workout_log_routine_v1';

function cloneRoutine(r) { return JSON.parse(JSON.stringify(r)); }

function loadRoutine() {
  try {
    const raw = localStorage.getItem(ROUTINE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const keys = parsed ? sortedDayKeys(parsed) : [];
      if (keys.length > 0) {
        const clean = {};
        keys.forEach(k => { clean[k] = parsed[k]; });
        DAY_ORDER = keys;
        return clean;
      }
    }
  } catch (e) {}
  DAY_ORDER = Object.keys(DEFAULT_ROUTINE);
  return cloneRoutine(DEFAULT_ROUTINE);
}
function saveRoutine() {
  try { localStorage.setItem(ROUTINE_KEY, JSON.stringify(ROUTINE)); } catch (e) { console.error('No se pudo guardar la rutina', e); }
}
let ROUTINE = loadRoutine();

function findExDef(name) {
  for (const d of DAY_ORDER) {
    for (const g of ROUTINE[d].groups) {
      const found = g.exs.find(e => e.name === name);
      if (found) return found;
    }
  }
  return null;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    const oldRaw = localStorage.getItem('workout_log_v1');
    if (oldRaw) {
      const old = JSON.parse(oldRaw);
      return { sets: (old.sets || []).map(s => ({ ...s, day: null })) };
    }
    return { sets: [] };
  } catch (e) { return { sets: [] }; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) { console.error('No se pudo guardar', e); } }

let data = loadData();
let activeDay = 'd1';
try { activeDay = localStorage.getItem(ACTIVE_DAY_KEY) || DAY_ORDER[0]; } catch (e) {}
if (!ROUTINE[activeDay]) activeDay = DAY_ORDER[0];
let viewMode = 'browse';
try { viewMode = localStorage.getItem(VIEW_MODE_KEY) || 'browse'; } catch (e) {}
let selectedExercise = null;
let openHistoryExercise = null;
let historyFilter = 'all';

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isoFromDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtNum(n) {
  const r = Math.round(n * 100) / 100;
  return r % 1 === 0 ? String(r) : r.toFixed(1).replace(/\.0$/, '');
}
function fmtDateLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function allRoutineExerciseNames() {
  const names = [];
  DAY_ORDER.forEach(d => ROUTINE[d].groups.forEach(g => g.exs.forEach(e => { if (!names.includes(e.name)) names.push(e.name); })));
  return names;
}
function loggedExerciseNames() {
  const names = [];
  data.sets.forEach(s => { if (!names.includes(s.exercise)) names.push(s.exercise); });
  return names;
}

function renderDayTabs() {
  const box = document.getElementById('dayTabs');
  box.innerHTML = DAY_ORDER.map(d => `
    <button type="button" class="day-tab ${d === activeDay ? 'active' : ''}" data-day="${d}">
      <span class="n">Día ${dayNum(d)}</span>${escapeHtml(ROUTINE[d].label)}
    </button>`).join('');
  box.querySelectorAll('[data-day]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeDay = btn.getAttribute('data-day');
      try { localStorage.setItem(ACTIVE_DAY_KEY, activeDay); } catch (e) {}
      selectedExercise = null;
      renderPicker();
      renderDayTabs();
    });
  });
}

function renderModeSwitch() {
  const box = document.getElementById('modeSwitch');
  box.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-mode') === viewMode);
  });
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      viewMode = b.getAttribute('data-mode');
      try { localStorage.setItem(VIEW_MODE_KEY, viewMode); } catch (e) {}
      renderModeSwitch();
      renderPicker();
    };
  });
}

function selectExercise(name) {
  selectedExercise = name;
  document.getElementById('exerciseInput').value = name;
  document.getElementById('formError').classList.remove('show');
  renderLastTimeBox();
  renderTargetHint();
  document.getElementById('weightInput').focus();
}

function renderPicker() {
  const box = document.getElementById('pickerBox');
  const day = ROUTINE[activeDay];
  const today = todayISO();

  if (viewMode === 'edit') {
    renderEditor(box, day);
    return;
  }

  if (viewMode === 'browse') {
    box.innerHTML = day.groups.map(g => `
      <div class="picker-group">
        <div class="picker-group-name">${escapeHtml(g.group)}</div>
        <div class="picker-chips">
          ${g.exs.map(e => `<button type="button" class="pick-chip ${selectedExercise === e.name ? 'selected' : ''}" data-ex="${escapeHtml(e.name)}">${escapeHtml(e.name)}<span class="scheme">${e.sets}×${e.scheme}</span></button>`).join('')}
        </div>
      </div>`).join('');
    box.querySelectorAll('[data-ex]').forEach(btn => {
      btn.addEventListener('click', () => { selectExercise(btn.getAttribute('data-ex')); renderPicker(); });
    });
  } else {
    const allExs = day.groups.flatMap(g => g.exs);
    box.innerHTML = `<div class="session-list">` + allExs.map(e => {
      const done = data.sets.filter(s => s.date === today && s.day === activeDay && s.exercise === e.name).length;
      const isDone = done >= e.sets;
      return `
        <button type="button" class="session-row2 ${isDone ? 'done' : ''}" data-ex="${escapeHtml(e.name)}">
          <span class="chk">${isDone ? '&#10003;' : ''}</span>
          <span class="info">
            <span class="nm">${escapeHtml(e.name)}</span>
            <span class="sub">${e.sets}×${e.scheme}${e.note ? ' · ' + escapeHtml(e.note) : ''}</span>
          </span>
          <span class="prog">${done}/${e.sets}</span>
        </button>`;
    }).join('') + `</div>`;
    box.querySelectorAll('[data-ex]').forEach(btn => {
      btn.addEventListener('click', () => { selectExercise(btn.getAttribute('data-ex')); renderPicker(); });
    });
  }
}

function updateDayTabLabel(dayKey) {
  const tab = document.querySelector(`.day-tab[data-day="${dayKey}"]`);
  if (tab) {
    const n = tab.querySelector('.n');
    tab.innerHTML = '';
    if (n) tab.appendChild(n);
    else { const s = document.createElement('span'); s.className = 'n'; s.textContent = 'Día ' + dayNum(dayKey); tab.appendChild(s); }
    tab.appendChild(document.createTextNode(ROUTINE[dayKey].label));
  }
}


/* ---------- Importar rutina desde PDF / TXT ---------- */
const PDFJS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function loadPdfJs() {
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const sc = document.createElement('script');
    sc.src = PDFJS_SRC;
    sc.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      resolve(window.pdfjsLib);
    };
    sc.onerror = () => reject(new Error('No se pudo cargar el lector de PDF (¿sin conexión?).'));
    document.head.appendChild(sc);
  });
}

async function extractPdfLines(file) {
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rows = [];
    content.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, str: it.str });
    });
    rows.sort((a, b) => b.y - a.y);
    rows.forEach(r => {
      r.items.sort((a, b) => a.x - b.x);
      lines.push(r.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim());
    });
  }
  return lines;
}

function parseRoutineLines(lines) {
  const dayRe = /^(?:d[ií]a|day)\s*(\d+)\s*[-–—:.)]*\s*(.*)$/i;
  const sxRe = /(\d+)\s*(?:series?\s*)?[x×X]\s*(\d+(?:\s*[-–]\s*\d+)?)/;
  const schemeRe = /\d+(?:\s*[-–/]\s*\d+){1,}/;
  const routine = {};
  let dayCount = 0, curDay = null, curGroup = null, lastEx = null;

  function newDay(label) {
    dayCount++;
    curDay = { label: label || ('Día ' + dayCount), groups: [] };
    routine['d' + dayCount] = curDay;
    curGroup = null; lastEx = null;
  }
  function ensureGroup(name) {
    if (!curDay) newDay('Rutina importada');
    curGroup = { group: name || 'Ejercicios', exs: [] };
    curDay.groups.push(curGroup);
  }
  const clean = t => t.replace(/^[\s•·\-–—*▪●○■□>\d]+[.)]?\s+(?=[^\d])/, '').replace(/^[\s•·\-–—*▪●○■□>]+/, '').replace(/[\s:;,\-–—]+$/, '').trim();

  lines.forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const dm = line.match(dayRe);
    if (dm) { newDay(dm[2].trim()); return; }

    let sets = 0, scheme = '', idx = -1, len = 0;
    let m = line.match(sxRe);
    if (m) {
      sets = parseInt(m[1], 10);
      const reps = m[2].replace(/\s+/g, '').split(/[-–]/).pop();
      scheme = Array(sets).fill(reps).join('-');
      idx = m.index; len = m[0].length;
    } else {
      m = line.match(schemeRe);
      if (m) {
        const parts = m[0].split(/\s*[-–/]\s*/);
        sets = parts.length; scheme = parts.join('-');
        idx = m.index; len = m[0].length;
      }
    }

    if (sets > 0 && sets <= 30) {
      const name = clean(line.slice(0, idx));
      const note = line.slice(idx + len).replace(/^[\s:;,\-–—()]+/, '').replace(/[()\s]+$/, '').trim();
      if (!name) { if (lastEx && note) lastEx.note = (lastEx.note ? lastEx.note + ', ' : '') + note; return; }
      if (!curGroup) ensureGroup(curDay ? curDay.label : 'Ejercicios');
      lastEx = { name, sets, scheme, note };
      curGroup.exs.push(lastEx);
    } else {
      const text = clean(line);
      if (!text) return;
      const looksHeader = text.length <= 40 && !/[.]$/.test(text) && text.split(' ').length <= 5;
      if (looksHeader) { ensureGroup(text); lastEx = null; }
      else if (lastEx) { lastEx.note = (lastEx.note ? lastEx.note + ' ' : '') + text; }
    }
  });

  Object.keys(routine).forEach(k => {
    routine[k].groups = routine[k].groups.filter(g => g.exs.length > 0);
    if (!routine[k].groups.length) delete routine[k];
  });
  // Renumerar d1..dN sin huecos
  const out = {};
  Object.keys(routine).forEach((k, i) => { out['d' + (i + 1)] = routine[k]; });
  return out;
}

function showImportPreview(parsed) {
  const keys = Object.keys(parsed);
  const total = keys.reduce((n, k) => n + parsed[k].groups.reduce((m, g) => m + g.exs.length, 0), 0);
  const body = `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">${keys.length} día(s), ${total} ejercicio(s). Podrás corregir todo en Editar después. Se guardará un punto de restauración antes de aplicar.</div>` +
    keys.map(k => {
      const d = parsed[k];
      return `<div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:4px">Día ${k.slice(1)} · ${escapeHtml(d.label)}</div>` +
        d.groups.map(g => g.exs.map(e => `<div style="font-size:12.5px;color:var(--muted);padding:1px 0">${escapeHtml(e.name)} — ${e.sets} × ${escapeHtml(e.scheme)}</div>`).join('')).join('') + '</div>';
    }).join('');
  openSheet('Vista previa de la rutina', body, [
    { label: 'Cancelar' },
    { label: 'Añadir a mi rutina', fn: async () => {
        await takeSnapshot('Antes de importar rutina (PDF)');
        const maxId = Math.max(0, ...DAY_ORDER.map(k => parseInt(k.slice(1), 10)));
        keys.forEach((k, i) => { const nk = 'd' + (maxId + 1 + i); ROUTINE[nk] = parsed[k]; DAY_ORDER.push(nk); });
        saveRoutine(); renderAll(); renderBackupUI(); toast('Rutina añadida');
    } },
    { label: 'Reemplazar mi rutina', primary: true, fn: async () => {
        await takeSnapshot('Antes de importar rutina (PDF)');
        ROUTINE = parsed;
        DAY_ORDER = Object.keys(parsed);
        activeDay = DAY_ORDER[0];
        historyFilter = 'all';
        selectedExercise = null;
        try { localStorage.setItem(ACTIVE_DAY_KEY, activeDay); } catch (e) {}
        saveRoutine(); renderAll(); renderBackupUI(); toast('Rutina reemplazada');
    } }
  ]);
}

async function importRoutineFile(file) {
  try {
    let lines;
    if (/\.txt$/i.test(file.name) || file.type === 'text/plain') {
      lines = (await file.text()).split(/\r?\n/);
    } else {
      lines = await extractPdfLines(file);
    }
    if (!lines.length) { alert('No se encontró texto en el archivo. Si es un PDF escaneado (foto), no se puede leer.'); return; }
    const parsed = parseRoutineLines(lines);
    if (!Object.keys(parsed).length) {
      alert('No pude reconocer ejercicios. Formato esperado:\n\nDía 1 - Pecho\nPress banca 4x8\nAperturas 3x10-12 (nota opcional)');
      return;
    }
    showImportPreview(parsed);
  } catch (err) {
    alert('No se pudo leer el archivo: ' + (err && err.message ? err.message : err));
  }
}

function renderLastTimeBox() {

  const past = data.sets.filter(s => s.exercise === ex && s.date !== today);
  if (past.length === 0) { box.innerHTML = ''; return; }
  const lastDate = past.reduce((max, s) => s.date > max ? s.date : max, past[0].date);
  const lastSets = past.filter(s => s.date === lastDate).sort((a,b) => a.ts - b.ts);
  const setStr = lastSets.map(s => `${fmtNum(s.weight)}×${fmtNum(s.reps)}`).join('  ');

}

function progressionHint(ex, def) {
  const past = data.sets.filter(x => x.exercise === ex && x.date !== todayISO());
  if (!past.length || !def) return '';
  const last = past.reduce((m, x) => x.date > m ? x.date : m, past[0].date);
  const ls = past.filter(x => x.date === last).sort((p, q) => p.ts - q.ts);
  const t = String(def.scheme).split(/[-–]/).map(Number).filter(n => n > 0);
  if (!t.length) return '';
  const hit = ls.length >= (def.sets || 1) && ls.every((x, i) => x.reps >= (t[i] !== undefined ? t[i] : t[t.length - 1]));
  const ws = ls.map(x => hit ? x.weight + (x.weight < 20 ? 1 : 2.5) : x.weight);
  const txt = new Set(ws).size > 1 ? ws.map(fmtNum).join(' · ') : fmtNum(ws[0]);
  return hit ? `Sugerencia: lo lograste todo, sube a <b>${txt} kg</b>` : `Sugerencia: repite <b>${txt} kg</b> y busca llegar a las reps objetivo`;
}

  box.innerHTML = `<div class="target-hint">Objetivo: ${def.sets}×${def.scheme}${def.note ? ' · ' + escapeHtml(def.note) : ''}</div>` + (sug ? `<div class="target-hint">${sug}</div>` : '');
}

function renderHistory() {
  const container = document.getElementById('historyList');
  let sets = data.sets;
  if (historyFilter !== 'all') sets = sets.filter(s => s.day === historyFilter);

  const names = [];
  sets.forEach(s => { if (!names.includes(s.exercise)) names.push(s.exercise); });

  if (names.length === 0) {
    container.innerHTML = '<div class="empty-state">Aqui apareceran tus ejercicios en cuanto registres la primera serie.</div>';
    return;
  }

  container.innerHTML = names.map(ex => {
    const exSets = sets.filter(s => s.exercise === ex);
    const byDate = {};
    exSets.forEach(s => { if (!byDate[s.date]) byDate[s.date] = []; byDate[s.date].push(s); });
    const dates = Object.keys(byDate).sort();
    const sessions = dates.map(d => {
      const ss = byDate[d];
      const maxW = Math.max(...ss.map(s => s.weight));
      return { date: d, maxW, sets: ss.sort((a,b)=>a.ts-b.ts) };
    });
    const isOpen = openHistoryExercise === ex;
    const recentSessions = sessions.slice(-8);
    const chartMax = Math.max(...recentSessions.map(s => s.maxW), 1);
    const bars = recentSessions.map(s => {
      const h = Math.max(6, Math.round((s.maxW / chartMax) * 62));
      return `<div class="bar-col"><div class="bar" style="height:${h}px"></div><div class="bar-label">${fmtDateLabel(s.date)}</div></div>`;
    }).join('');
    const sessionRows = sessions.slice().reverse().map(s => {
      const setStr = s.sets.map(x => `${fmtNum(x.weight)}×${fmtNum(x.reps)}`).join(', ');
      return `<div class="session-row"><span class="d">${fmtDateLabel(s.date)}</span><span class="s">${setStr}</span></div>`;
    }).join('');

    return `
      <div class="history-item ${isOpen ? 'open' : ''}" data-ex="${escapeHtml(ex)}">
        <button type="button" class="history-item-head" data-toggle="${escapeHtml(ex)}">
          <span>${escapeHtml(ex)}<br><span class="meta">${sessions.length} sesion${sessions.length===1?'':'es'} · mejor ${fmtNum(Math.max(...sessions.map(s=>s.maxW)))} kg</span></span>
          <span class="chev">&#9662;</span>
        </button>
        <div class="history-body">
          <div class="chart-wrap"><div class="bars">${bars}</div></div>
          ${sessionRows}
          <button type="button" class="del-ex" data-delex="${escapeHtml(ex)}">Eliminar historial de ${escapeHtml(ex)}</button>
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ex = btn.getAttribute('data-toggle');
      openHistoryExercise = openHistoryExercise === ex ? null : ex;
      renderHistory();
    });
  });
  container.querySelectorAll('[data-delex]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ex = btn.getAttribute('data-delex');
      if (confirm(`Eliminar todo el historial de "${ex}"? Esta accion no se puede deshacer.`)) {
        data.sets = data.sets.filter(s => s.exercise !== ex);
        saveData(data);
        openHistoryExercise = null;
        renderAll();
      }
    });
  });
}

function renderStreak() {
  const card = document.getElementById('streakCard');
  const dateSet = Array.from(new Set(data.sets.map(s => s.date))).sort();
  let streak = 0;
  let active = false;
  if (dateSet.length > 0) {
    streak = 1;
    let cur = new Date(dateSet[dateSet.length - 1] + 'T00:00:00');
    for (let i = dateSet.length - 2; i >= 0; i--) {
      const prev = new Date(dateSet[i] + 'T00:00:00');
      const diffDays = Math.round((cur - prev) / 86400000);
      if (diffDays <= 2) { streak++; cur = prev; } else break;
    }
    const todayD = new Date(todayISO() + 'T00:00:00');
    const lastD = new Date(dateSet[dateSet.length - 1] + 'T00:00:00');

  }

    <div class="streak-top">
      <div class="streak-stat">
        <span class="streak-num">${streak}</span>

  `;
}

let progExSel = null;
function e1rm(w, r) { r = Math.min(r, 12); return r <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30)); }

function renderProgress() {
  const sel = document.getElementById('progEx'), prs = document.getElementById('progPRs'), ch = document.getElementById('progChart');

  const bestV = mine.reduce((b, x) => x.weight * x.reps > b.weight * b.reps ? x : b, mine[0]);

  const W = 320, H = 150, P = 30, vs = pts.map(q => q.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);

function mondayISO(iso) {

function fmtTime(sec) {
  const s = Math.max(0, Math.round(sec));

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start();
    o.stop(ctx.currentTime + 0.5);
  } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
}
function tickTimer() {
  restRemaining -= 1;
  if (restRemaining <= 0) {
    restRemaining = 0;
    stopTimer();
    beep();
  }
  renderTimerDisplay();
}
function startTimer(reset) {
  if (reset) restRemaining = restDuration;
  if (restRunning) return;
  restRunning = true;
  restIntervalId = setInterval(tickTimer, 1000);
  renderTimerDisplay();
}
function pauseTimer() {
  restRunning = false;
  if (restIntervalId) clearInterval(restIntervalId);
  renderTimerDisplay();
}
function stopTimer() {
  restRunning = false;
  if (restIntervalId) clearInterval(restIntervalId);

}

/* --- Backup export / import --- */
/* ================= Sistema de copias de seguridad ================= */
const LAST_EXPORT_KEY = 'workout_log_last_export';
const BANNER_SNOOZE_KEY = 'workout_log_banner_snooze';
const RECOVERED_KEY = 'workout_log_recovered';
const SNAP_MAX = 15;
let allowEmptyMirror = false;

/* --- IndexedDB (copia espejo y puntos de restauracion) --- */
function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('sin IndexedDB'));
    const r = indexedDB.open('registro_entreno', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

/* --- Construir / validar copias --- */
function buildBackup() {
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  return {
    app: 'registro-entreno', version: 3, exportedAt: new Date().toISOString(),
    sets: data.sets, routine: ROUTINE,
    settings: { theme: theme, restDuration: restDuration, activeDay: activeDay }
  };
}
function cloneBackup() { return JSON.parse(JSON.stringify(buildBackup())); }
function normalizeBackup(o) {
  if (!o || !Array.isArray(o.sets)) throw new Error('formato invalido');
  const sets = o.sets.filter(x => x && typeof x.exercise === 'string');
  let routine = null;
  if (o.routine && typeof o.routine === 'object') {
    const keys = sortedDayKeys(o.routine);
    if (keys.length) { routine = {}; keys.forEach(k => { routine[k] = o.routine[k]; }); }
  }
  return { sets: sets, routine: routine, settings: (o.settings && typeof o.settings === 'object') ? o.settings : {}, exportedAt: o.exportedAt || null };
}
function describeBackup(b) {
  const days = b.routine ? Object.keys(b.routine).length : null;
  return b.sets.length + ' series' + (days !== null ? ' · ' + days + ' días de rutina' : '');
}
function fmtStamp(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

/* --- Puntos de restauracion --- */
async function takeSnapshot(reason, onlyIfChanged) {
  try {
    const b = cloneBackup();
    const list = (await idbGet('snapshots')) || [];
    if (onlyIfChanged && list.length) {
      const last = list[0].backup;
      if (JSON.stringify(last.sets) === JSON.stringify(b.sets) && JSON.stringify(last.routine) === JSON.stringify(b.routine)) return;
    }
    list.unshift({ t: Date.now(), reason: reason, backup: b });
    await idbSet('snapshots', list.slice(0, SNAP_MAX));
  } catch (e) { console.error('No se pudo crear el punto de restauracion', e); }
}
async function applyBackup(b, reason) {
  await takeSnapshot(reason || 'Antes de restaurar copia');
  data = { sets: b.sets };
  saveData(data);
  if (b.routine) { ROUTINE = b.routine; DAY_ORDER = Object.keys(b.routine); saveRoutine(); }
  try {
    const st = b.settings || {};
    if (st.theme) localStorage.setItem(THEME_KEY, st.theme);
    if (st.restDuration > 0) localStorage.setItem(REST_DUR_KEY, String(st.restDuration));
    if (st.activeDay && b.routine && b.routine[st.activeDay]) localStorage.setItem(ACTIVE_DAY_KEY, st.activeDay);
    else if (b.routine) localStorage.setItem(ACTIVE_DAY_KEY, DAY_ORDER[0]);
  } catch (e) {}
  try { await idbSet('mirror', cloneBackup()); } catch (e) {}
  location.reload();
}

/* --- Copia espejo automatica en cada guardado --- */
let mirrorTimer = null;
function scheduleMirror() {
  clearTimeout(mirrorTimer);
  mirrorTimer = setTimeout(async () => {
    try {
      const b = cloneBackup();
      if (!allowEmptyMirror && b.sets.length === 0) {
        const old = await idbGet('mirror');
        if (old && old.sets && old.sets.length > 0) return;
      }
      await idbSet('mirror', b);
    } catch (e) {}
  }, 600);
}
const _origSaveData = saveData;
saveData = function (d) { _origSaveData(d); scheduleMirror(); };
const _origSaveRoutine = saveRoutine;
saveRoutine = function () { _origSaveRoutine(); scheduleMirror(); };

/* --- Recuperacion automatica si el navegador borro localStorage --- */
async function recoverIfEmpty() {
  if (!LS_WAS_EMPTY) return false;
  try {
    if (sessionStorage.getItem('rec_tried')) return false;
    const m = await idbGet('mirror');
    if (!m || !Array.isArray(m.sets)) return false;
    const custom = m.routine && JSON.stringify(m.routine) !== JSON.stringify(DEFAULT_ROUTINE);
    if (m.sets.length === 0 && !custom) return false;
    sessionStorage.setItem('rec_tried', '1');
    const b = normalizeBackup(m);
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ sets: b.sets }));
    if (b.routine) localStorage.setItem(ROUTINE_KEY, JSON.stringify(b.routine));
    const st = b.settings || {};
    if (st.theme) localStorage.setItem(THEME_KEY, st.theme);
    if (st.restDuration > 0) localStorage.setItem(REST_DUR_KEY, String(st.restDuration));
    localStorage.setItem(RECOVERED_KEY, '1');
    location.reload();
    return true;
  } catch (e) { return false; }
}

/* --- Guardar copia en archivo --- */
function markExported() {
  try { localStorage.setItem(LAST_EXPORT_KEY, String(Date.now())); localStorage.removeItem(BANNER_SNOOZE_KEY); } catch (e) {}
  renderBackupUI();
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
async function saveBackupFile(forceDownload) {
  const payload = JSON.stringify(buildBackup(), null, 2);
  const filename = 'registro-entreno-' + todayISO() + '.json';
  try {
    const file = new File([payload], filename, { type: 'application/json' });
    if (!forceDownload && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Copia de Registro de entreno' });
        markExported();
        toast('Copia guardada');
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
  } catch (e) {}
  try {
    downloadBlob(new Blob([payload], { type: 'application/json' }), filename);
    markExported();
    toast('Copia descargada');
  } catch (err) { alert('No se pudo exportar la copia de seguridad.'); }
}
function exportCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = ['fecha,dia,ejercicio,peso_kg,repeticiones'];
  data.sets.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach(s => {
    const d = s.day && ROUTINE[s.day] ? ROUTINE[s.day].label : '';
    rows.push([q(s.date), q(d), q(s.exercise), s.weight, s.reps].join(','));
  });
  downloadBlob(new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv;charset=utf-8' }), 'registro-entreno-' + todayISO() + '.csv');
}

        '<div class="bb-row"><button class="go" id="bbSave" type="button">Guardar copia ahora</button><button id="bbLater" type="button">Luego</button></div>';
      bn.classList.add('show');
      document.getElementById('bbSave').onclick = () => saveBackupFile(false);
      document.getElementById('bbLater').onclick = () => {
        try { localStorage.setItem(BANNER_SNOOZE_KEY, String(Date.now() + 864e5)); } catch (e) {}
        renderBackupUI();
      };
    } else { bn.classList.remove('show'); bn.innerHTML = ''; }
  }
}

document.getElementById('shareBackupBtn').addEventListener('click', () => saveBackupFile(false));
document.getElementById('exportBtn').addEventListener('click', () => saveBackupFile(true));
document.getElementById('csvBtn').addEventListener('click', exportCsv);
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let b;
  try { b = normalizeBackup(JSON.parse(await f.text())); }
  catch (err) { alert('El archivo no tiene un formato válido.'); return; }
  const body = '<div style="font-size:13px;line-height:1.6">' +
    '<b>Archivo:</b> ' + describeBackup(b) + (b.exportedAt ? ' (guardado ' + fmtStamp(b.exportedAt) + ')' : '') + '<br>' +
    '<b>Ahora en el móvil:</b> ' + describeBackup({ sets: data.sets, routine: ROUTINE }) + '<br><br>' +
    '<b>Combinar</b>: añade las series que falten y conserva tu rutina actual.<br>' +
    '<b>Reemplazar todo</b>: deja el móvil exactamente como el archivo.<br>' +
    '<span style="color:var(--muted)">Se guarda un punto de restauración antes de cambiar nada.</span></div>';
  openSheet('Restaurar copia', body, [
    { label: 'Cancelar' },
    { label: 'Combinar', fn: async () => {
        await takeSnapshot('Antes de combinar copia');
        const ids = new Set(data.sets.map(s => s.id));
        let added = 0;
        b.sets.forEach(s => { if (!s.id || !ids.has(s.id)) { data.sets.push(s); if (s.id) ids.add(s.id); added++; } });
        data.sets.sort((x, y) => (x.ts || 0) - (y.ts || 0));
        saveData(data); renderAll(); renderBackupUI();
        toast(added + ' series añadidas');
    } },
    { label: 'Reemplazar todo', primary: true, fn: () => applyBackup(b, 'Antes de restaurar copia') }
  ]);
});
document.getElementById('snapBtn').addEventListener('click', async () => {
  let list = [];
  try { list = (await idbGet('snapshots')) || []; } catch (e) {}
  if (!list.length) { alert('Todavía no hay puntos de restauración. Se crean solos cada día que usas la app y antes de cualquier cambio importante.'); return; }
  const body = '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Se crean solos (una vez al día y antes de importar, restaurar o borrar). Se guardan los últimos ' + SNAP_MAX + '.</div>' +
    list.map((sn, i) => '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:0.5px solid var(--line)"><div style="flex:1;font-size:13px"><b>' + escapeHtml(fmtStamp(sn.t)) + '</b> · ' + escapeHtml(sn.reason) + '<br><span style="color:var(--muted)">' + describeBackup(sn.backup) + '</span></div><button type="button" class="backup-btn snap-restore" data-i="' + i + '">Restaurar</button></div>').join('');
  const ov = openSheet('Puntos de restauración', body, [{ label: 'Cerrar' }]);
  ov.querySelectorAll('.snap-restore').forEach(btn => {
    btn.addEventListener('click', () => {
      const sn = list[parseInt(btn.getAttribute('data-i'), 10)];
      if (!confirm('Restaurar el punto del ' + fmtStamp(sn.t) + '? Antes se guardará un punto con tus datos actuales.')) return;
      ov.remove();
      applyBackup(normalizeBackup(sn.backup), 'Antes de volver a un punto anterior');
    });
  });
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Esto borrará todas las series registradas en este dispositivo. Antes se guardará un punto de restauración por si te arrepientes. ¿Seguro?')) return;
  await takeSnapshot('Antes de borrar todos los datos');
  allowEmptyMirror = true;
  data = { sets: [] };
  saveData(data);
  openHistoryExercise = null;
  renderAll();
  renderBackupUI();
  toast('Datos borrados. Puedes volver atrás en "Puntos de restauración".');
});

async function backupInit() {
  if (await recoverIfEmpty()) return;
  try { if (localStorage.getItem(RECOVERED_KEY)) { localStorage.removeItem(RECOVERED_KEY); toast('Se recuperaron tus datos automáticamente'); } } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  // punto de restauracion automatico (max. 1 cada 12 h, solo si hay datos y han cambiado)
  try {
    const hasValue = data.sets.length > 0 || JSON.stringify(ROUTINE) !== JSON.stringify(DEFAULT_ROUTINE);
    if (hasValue) {
      const list = (await idbGet('snapshots')) || [];
      if (!list.length || Date.now() - list[0].t > 12 * 36e5) await takeSnapshot('Automático', true);
    }
  } catch (e) {}
  scheduleMirror();
  renderBackupUI();
}

document.getElementById('progEx').addEventListener('change', (e) => { progExSel = e.target.value; renderProgress(); });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
renderAll();
backupInit();
</script>
</body>
</html>
